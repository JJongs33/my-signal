name: daily-signal

on:
  schedule:
    - cron: "0 1 * * 2-6"    # Tue-Sat 01:00 UTC = 10:00 Korea time: morning run (new US close is in), notification
    - cron: "0 12 * * 2-6"   # Tue-Sat 12:00 UTC = 21:00 Korea time: evening run (reminder before the US open), notification
  workflow_dispatch:          # "Run workflow" button: refresh data and send ONE test notification with the current state
    inputs:
      test_push:
        description: "send a test notification"
        type: boolean
        default: true

permissions:
  contents: write             # lets the job save docs/data.json and docs/prices.json back to the repository

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: compute signal, update app data, notify
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.test_push }}" = "true" ]; then
            python signal_job.py --test-push
          elif [ "${{ github.event.schedule }}" = "0 1 * * 2-6" ]; then
            python signal_job.py --slot 아침
          else
            python signal_job.py --slot 저녁
          fi
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          VAPID_SUB: https://${{ github.repository_owner }}.github.io
      - name: save app data
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add docs/data.json docs/prices.json
          git commit -m "data $(date -u +%F)" || echo "nothing new"
          git pull --rebase origin main || true
          git push
