name: weekly-signal

on:
  schedule:
    - cron: "0 23 * * 5"   # Friday 23:00 UTC = Saturday 08:00 Korea time (after the US Friday close)
  workflow_dispatch:        # "Run workflow" button for a manual run / test

permissions:
  contents: write           # lets the job save docs/data.json back to the repository

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: compute signal, update app data, send push
        run: python signal_job.py
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          VAPID_SUB: https://${{ github.repository_owner }}.github.io
      - name: save app data
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add docs/data.json
          git commit -m "weekly signal $(date -u +%F)" || echo "nothing new"
          git push
