name: weekly-signal

on:
  schedule:
    - cron: "0 23 * * 0"     # Sunday 23:00 UTC = Monday 08:00 Korea time: weekly signal + push notification
    - cron: "0 22 * * 1-5"   # Mon-Fri 22:00 UTC = Tue-Sat 07:00 Korea time: refresh prices only (no notification)
  workflow_dispatch:          # "Run workflow" button: full run with notification (for tests)

permissions:
  contents: write             # lets the job save docs/data.json and docs/prices.json back to the repository

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: compute signal, update app data (push only on the weekly run)
        run: |
          if [ "${{ github.event.schedule }}" = "0 22 * * 1-5" ]; then
            python signal_job.py --no-push
          else
            python signal_job.py
          fi
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          VAPID_SUB: https://${{ github.repository_owner }}.github.io
      - name: save app data
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add docs/data.json docs/prices.json
          git commit -m "data $(date -u +%F)" || echo "nothing new"
          git pull --rebase origin main || true
          git push
